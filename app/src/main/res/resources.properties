# Declares the language that the unqualified res/values/ folder is written in — English (US).
#
# Required by `androidResources.generateLocaleConfig` in app/build.gradle.kts: without it AGP
# cannot tell which locale the default strings represent, so it cannot include English in the
# generated locale config and the system's per-app language picker would omit it.
#
# Adding a language means creating res/values-<code>/strings.xml. AGP regenerates the locale
# config from the folders present, so no list needs updating by hand.
unqualifiedResLocale=en-US
